name: Numerical discrepancy
description: stat_power disagrees with pwr, R, SAS, G*Power or a published result
title: "[discrepancy]: "
labels: ["numerical", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Numerical disagreements are the highest-priority class of bug in this
        library. Even a difference in the sixth decimal place is worth
        reporting.

  - type: input
    id: version
    attributes:
      label: stat_power version
      placeholder: 0.1.0.alpha.2
    validations:
      required: true

  - type: dropdown
    id: reference
    attributes:
      label: Reference implementation
      options:
        - CRAN pwr
        - R (other package)
        - G*Power
        - SAS
        - Published paper or textbook
        - Other
    validations:
      required: true

  - type: input
    id: reference_version
    attributes:
      label: Reference version or citation
      description: Package version, software version, or full citation with page number.
      placeholder: "pwr 1.3-0"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: stat_power code and output
      description: A runnable snippet and the value it produced.
      render: ruby
      placeholder: |
        require "stat_power"

        result = StatPower::TTest.two_sample(effect_size: 0.5, alpha: 0.05, power: 0.8)
        result.sample_size
        # => 63.76576
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Reference code and output
      description: The snippet you ran against the reference tool and its output.
      placeholder: |
        library(pwr)
        pwr.t.test(d = 0.5, sig.level = 0.05, power = 0.8)
        # n = 63.76561
    validations:
      required: true

  - type: textarea
    id: magnitude
    attributes:
      label: Size of the disagreement
      description: Absolute and relative difference, if you have computed them.
    validations:
      required: false
