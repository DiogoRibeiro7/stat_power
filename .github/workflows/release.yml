name: Release gem

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(ruby -Ilib -rstat_power/version -e 'print StatPower::VERSION')"
          EXPECTED_TAG="v${VERSION}"

          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match gem version ${VERSION}."
            echo "Expected tag: ${EXPECTED_TAG}"
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag must point to a commit contained in main."
            exit 1
          fi

      - name: Run release checks
        run: |
          bundle exec rspec
          bundle exec rubocop
          bundle exec rbs validate
          gem build stat_power.gemspec

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(ruby -Ilib -rstat_power/version -e 'print StatPower::VERSION')"
          RELEASE_ARGS=(
            "${GITHUB_REF_NAME}"
            "--verify-tag"
            "--title" "${GITHUB_REF_NAME}"
            "--generate-notes"
          )

          if [[ "${VERSION}" =~ [[:alpha:]] ]]; then
            RELEASE_ARGS+=("--prerelease")
          fi

          gh release create "${RELEASE_ARGS[@]}"
