AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "coverage/**/*"
    - "pkg/**/*"

# Line endings are normalised to LF by .gitattributes so that a lint run gives
# the same answer on Linux, macOS and Windows.
Layout/EndOfLine:
  EnforcedStyle: lf

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# Single-letter parameter names are the conventional notation in the statistical
# literature these methods implement.
Naming/MethodParameterName:
  AllowedNames:
    - x
    - p
    - p1
    - p2
    - a
    - b
    - df

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Metrics/ModuleLength:
  Max: 500

Metrics/MethodLength:
  Max: 50

Metrics/AbcSize:
  Max: 50

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Metrics/ParameterLists:
  Max: 9

Lint/AmbiguousOperatorPrecedence:
  Enabled: false
