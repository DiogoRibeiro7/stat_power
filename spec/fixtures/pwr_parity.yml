version: "pwr 1.3-0"

cases:
  - id: norm_power_two_sided
    pwr_function: pwr.norm.test
    reference: internal parity reference
    call: normal_mean
    arguments:
      effect_size: 0.5
      sample_size: 30
      alpha: 0.05
    expected:
      field: power
      value: 0.7819079987
      tolerance: 1.0e-8

  - id: norm_sample_size
    pwr_function: pwr.norm.test
    reference: inverse parity reference
    call: normal_mean
    arguments:
      effect_size: 0.5
      alpha: 0.05
      power: 0.8
    expected:
      field: sample_size
      value: 31.39544204
      tolerance: 1.0e-6

  - id: proportion_one_cohen_6_5
